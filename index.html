<div id="app-root"></div>
<style>
  #app-root {
    --ink: #1c2431;
    --ink-soft: #4a5468;
    --paper: #fbfaf7;
    --paper-line: #d8d3c6;
    --seal-red: #a8342a;
    --blue: #1c4e9e;
    --blue-bg: #e8eefb;
    --green: #1f6b3d;
    --gold: #a9822f;
    --note-bg: #fbf3e3;
    font-family: "Pretendard", "Noto Sans KR", -apple-system, sans-serif;
    color: var(--ink);
    background: var(--paper);
    background-image: linear-gradient(var(--paper-line) 1px, transparent 1px);
    background-size: 100% 2.1em;
    min-height: 100vh;
    padding: 0;
    box-sizing: border-box;
  }
  #app-root * { box-sizing: border-box; }

  .llt-shell { max-width: 980px; margin: 0 auto; padding: 40px 24px 80px; }

  .llt-masthead { text-align: center; border-bottom: 3px double var(--ink); padding-bottom: 18px; margin-bottom: 12px; }
  .llt-masthead .eyebrow { font-size: 12px; letter-spacing: 0.25em; color: var(--gold); font-weight: 700; margin-bottom: 6px; }
  .llt-masthead h1 { font-family: "Noto Serif KR", "Nanum Myeongjo", serif; font-size: 34px; margin: 0 0 8px; letter-spacing: -0.01em; }
  .llt-masthead p { color: var(--ink-soft); font-size: 14px; margin: 0; }

  .llt-source-note {
    text-align: center; font-size: 12px; color: var(--ink-soft);
    margin-bottom: 24px; padding: 8px; background: #fff; border: 1px dashed var(--paper-line); border-radius: 6px;
  }
  .llt-source-note strong { color: var(--gold); }

  .llt-search {
    display: flex; gap: 10px; align-items: center; justify-content: center; flex-wrap: wrap;
    background: #fff; border: 1px solid var(--paper-line); border-radius: 10px;
    padding: 16px; margin-bottom: 24px; box-shadow: 0 1px 0 rgba(0,0,0,0.03);
  }
  .llt-search label { font-size: 13px; color: var(--ink-soft); margin-right: 4px; }
  .llt-search select {
    font-family: inherit; font-size: 15px; padding: 8px 10px;
    border: 1px solid var(--paper-line); border-radius: 6px; background: #fff; color: var(--ink);
  }
  .llt-search button {
    font-family: inherit; font-size: 15px; font-weight: 700;
    background: var(--ink); color: #fff; border: none;
    padding: 10px 22px; border-radius: 6px; cursor: pointer; transition: opacity 0.15s;
  }
  .llt-search button:hover { opacity: 0.85; }
  .llt-search button:disabled { opacity: 0.5; cursor: default; }

  .llt-status { text-align: center; color: var(--ink-soft); font-size: 14px; padding: 30px 0; }
  .llt-status .step { margin-bottom: 4px; }
  .llt-status .dot { display:inline-block; width:6px;height:6px;border-radius:50%; background:var(--gold); margin:0 3px; animation: llt-blink 1.2s infinite ease-in-out; }
  .llt-status .dot:nth-child(2){animation-delay:.2s} .llt-status .dot:nth-child(3){animation-delay:.4s}
  @keyframes llt-blink { 0%,80%,100%{opacity:.2} 40%{opacity:1} }

  /* 법령 목록(아코디언) */
  .llt-lawlist { display: flex; flex-direction: column; gap: 10px; }
  .llt-lawitem { background: #fff; border: 1px solid var(--paper-line); border-radius: 10px; overflow: hidden; }
  .llt-lawbtn {
    width: 100%; text-align: left; background: none; border: none; cursor: pointer;
    padding: 16px 20px; display: flex; align-items: center; justify-content: space-between;
    font-family: inherit; gap: 12px;
  }
  .llt-lawbtn:hover { background: var(--paper); }
  .llt-lawbtn-name { font-family: "Noto Serif KR", "Nanum Myeongjo", serif; font-size: 17px; color: var(--ink); }
  .llt-lawbtn-meta { font-size: 12.5px; color: var(--gold); font-weight: 700; white-space: nowrap; }
  .llt-lawbtn-arrow { font-size: 13px; color: var(--ink-soft); transition: transform 0.15s; margin-left: 8px; }
  .llt-lawbtn-arrow.open { transform: rotate(90deg); }

  .llt-lawbody { padding: 4px 20px 22px; border-top: 1px solid var(--paper-line); }
  .llt-lawbody-loading { padding: 20px; text-align: center; color: var(--ink-soft); font-size: 13.5px; }
  .llt-lawbody-error { padding: 14px 16px; margin-top: 12px; color: var(--seal-red); background: #f7e9e7; border-radius: 8px; font-size: 13.5px; }

  .llt-difftable-wrap { margin: 14px 0 18px; }
  .llt-difftable-wrap h3 { font-size: 12px; letter-spacing: 0.08em; margin: 0 0 8px; color: var(--ink-soft); text-transform: uppercase; }

  table.llt-difftable { width: 100%; border-collapse: collapse; font-size: 13.5px; table-layout: fixed; margin-bottom: 14px; }
  table.llt-difftable th {
    background: var(--paper); border: 1px solid var(--paper-line); padding: 8px 10px;
    text-align: left; font-size: 12px; color: var(--ink-soft); letter-spacing: 0.04em;
  }
  table.llt-difftable th.col-gubun { width: 64px; }
  table.llt-difftable th.col-loc { width: 130px; }
  table.llt-difftable td {
    border: 1px solid var(--paper-line); padding: 10px 12px; vertical-align: top;
    font-family: "Noto Serif KR", serif; line-height: 1.8;
    white-space: pre-wrap; word-break: keep-all; overflow-wrap: break-word;
  }
  table.llt-difftable td.llt-gubun { font-family: inherit; text-align: center; vertical-align: middle; }
  table.llt-difftable td.llt-loc { font-family: inherit; color: var(--ink-soft); font-size: 12.5px; }

  .llt-badge {
    display: inline-block; padding: 3px 8px; border-radius: 4px; font-size: 12px; font-weight: 700;
    border: 1px solid currentColor;
  }
  .llt-badge.개정 { color: var(--ink-soft); }
  .llt-badge.신설 { color: var(--green); background: #e7f2ea; }
  .llt-badge.삭제 { color: var(--seal-red); background: #f7e9e7; }
  .llt-badge.제정 { color: var(--green); background: #e7f2ea; }

  .llt-blue { background: var(--blue-bg); color: var(--blue); font-weight: 700; padding: 0 3px; border-radius: 3px; }
  .llt-note { display: inline-block; background: var(--note-bg); color: var(--gold); font-style: italic; padding: 2px 6px; border-radius: 3px; font-size: 12.5px; margin-top: 4px; }
  .llt-nochange { color: var(--ink-soft); font-style: italic; font-size: 13.5px; }

  .llt-block { margin-bottom: 4px; }
  .llt-block h4 { font-size: 12.5px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--gold); margin: 0 0 6px; display:flex; align-items:center; gap:6px; }
  .llt-block p { font-size: 14.5px; line-height: 1.7; margin: 0; color: var(--ink); }

  .llt-empty { text-align:center; color: var(--ink-soft); font-size: 14px; padding: 50px 20px; border: 1px dashed var(--paper-line); border-radius: 10px; background:#fff; }
  .llt-error { color: var(--seal-red); font-size: 14px; padding: 16px 18px; background: #f7e9e7; border-radius: 8px; margin-bottom: 22px; line-height: 1.6; }
</style>

<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script type="text/babel">
const { useState } = React;

// 상대 경로("")로 지정하면 로컬(PC)과 Render 배포 환경 모두에서 자동으로 동작합니다.
const SERVER = "";

// 【...】는 실제 변경 문구(파란색), 《...》는 자동 매칭 실패 안내(노란 노트)
function highlight(text) {
  if (!text) return null;
  const parts = String(text).split(/(【[^】]*】|《[^》]*》)/g);
  return parts.map((p, i) => {
    if (p.startsWith('【') && p.endsWith('】')) {
      return <span key={i} className="llt-blue">{p.slice(1, -1)}</span>;
    }
    if (p.startsWith('《') && p.endsWith('》')) {
      return <div key={i} className="llt-note">{p.slice(1, -1)}</div>;
    }
    return p;
  });
}

function DiffTable({ rows }) {
  if (!rows || rows.length === 0) {
    return (
      <div className="llt-difftable-wrap">
        <h3>개정 내용 (조문 전체 대비표)</h3>
        <p className="llt-nochange">이번 개정에서는 조문 대비표가 제공되지 않았습니다. (타법 인용 변경 등 간접 개정일 수 있습니다)</p>
      </div>
    );
  }

  return (
    <div className="llt-difftable-wrap">
      <h3>개정 내용 (조문 전체 대비표)</h3>
      <table className="llt-difftable">
        <colgroup>
          <col className="col-gubun" />
          <col className="col-loc" />
          <col style={{width: "38%"}} />
          <col style={{width: "38%"}} />
        </colgroup>
        <thead>
          <tr>
            <th className="col-gubun">구분</th>
            <th className="col-loc">조문</th>
            <th>개정 전</th>
            <th>개정 후</th>
          </tr>
        </thead>
        <tbody>
          {rows.map((r, i) => (
            <tr key={i}>
              <td className="llt-gubun"><span className={`llt-badge ${r.구분}`}>{r.구분}</span></td>
              <td className="llt-loc">{r.위치}</td>
              <td>{highlight(r.개정전)}</td>
              <td>{highlight(r.개정후)}</td>
            </tr>
          ))}
        </tbody>
      </table>
    </div>
  );
}

function LawItem({ law, expanded, onToggle, detail, loading, error }) {
  const fmt = d => d ? d.replace(/(\d{4})(\d{2})(\d{2})/, "$1.$2.$3") : "";
  return (
    <div className="llt-lawitem">
      <button className="llt-lawbtn" onClick={onToggle}>
        <span className="llt-lawbtn-name">{law.법령명한글}</span>
        <span style={{display:"flex", alignItems:"center", gap:"10px"}}>
          <span className="llt-lawbtn-meta">시행일 {fmt(law.시행일자)}</span>
          <span className={`llt-lawbtn-arrow ${expanded ? "open" : ""}`}>▶</span>
        </span>
      </button>
      {expanded && (
        <div className="llt-lawbody">
          {loading && (
            <div className="llt-lawbody-loading">
              개정 전후 내용을 불러오는 중입니다
              <span className="dot"></span>
            </div>
          )}
          {error && <div className="llt-lawbody-error">⚠ {error}</div>}
          {detail && !loading && !error && (
            <React.Fragment>
              <DiffTable rows={detail.비교표} />
              <div className="llt-block">
                <h4>시사점</h4>
                <p>{detail.시사점}</p>
              </div>
            </React.Fragment>
          )}
        </div>
      )}
    </div>
  );
}

function App() {
  const years = [];
  const currentYear = new Date().getFullYear();
  for (let y = 2023; y <= currentYear + 1; y++) years.push(y);
  const months = Array.from({length: 12}, (_, i) => i + 1);

  const now = new Date();
  const [year, setYear] = useState(now.getFullYear());
  const [month, setMonth] = useState(now.getMonth() + 1);

  const [loading, setLoading] = useState(false);
  const [error, setError] = useState(null);
  const [lawList, setLawList] = useState(null);
  const [searched, setSearched] = useState(false);

  const [expandedMst, setExpandedMst] = useState(null);
  const [detailCache, setDetailCache] = useState({});
  const [detailLoading, setDetailLoading] = useState(null);
  const [detailError, setDetailError] = useState({});

  async function handleSearch() {
    setLoading(true);
    setError(null);
    setLawList(null);
    setSearched(true);
    setExpandedMst(null);

    try {
      const listRes = await fetch(`${SERVER}/api/laws?year=${year}&month=${month}`);
      if (!listRes.ok) throw new Error(`목록 조회 서버 오류 (${listRes.status})`);
      const listData = await listRes.json();
      setLawList(listData.laws || []);
    } catch (e) {
      console.error(e);
      setError(e.message || "조회 중 오류가 발생했습니다.");
    } finally {
      setLoading(false);
    }
  }

  async function handleToggle(law) {
    const mst = law.법령일련번호;
    if (expandedMst === mst) {
      setExpandedMst(null);
      return;
    }
    setExpandedMst(mst);

    if (detailCache[mst]) return;

    setDetailLoading(mst);
    setDetailError(prev => ({ ...prev, [mst]: null }));
    try {
      const res = await fetch(`${SERVER}/api/law-summary?mst=${mst}&efYd=${law.시행일자}`);
      const data = await res.json();
      if (!res.ok || data.error) throw new Error(data.error || `상세 조회 서버 오류 (${res.status})`);
      setDetailCache(prev => ({ ...prev, [mst]: data }));
    } catch (e) {
      console.error(e);
      setDetailError(prev => ({ ...prev, [mst]: e.message || "상세 정보를 가져오지 못했습니다." }));
    } finally {
      setDetailLoading(null);
    }
  }

  return (
    <div className="llt-shell">
      <div className="llt-masthead">
        <div className="eyebrow">LABOR LAW GAZETTE</div>
        <h1>노동법령 개정 레이더</h1>
        <p>연도와 월을 선택하고, 법령을 클릭하면 개정 전·후 비교가 펼쳐집니다.</p>
      </div>

      <div className="llt-source-note">
        데이터 출처: <strong>국가법령정보 공동활용 OPEN API</strong> (law.go.kr)
      </div>

      <div className="llt-search">
        <label htmlFor="llt-year">연도</label>
        <select id="llt-year" value={year} onChange={e => setYear(Number(e.target.value))}>
          {years.map(y => <option key={y} value={y}>{y}년</option>)}
        </select>
        <label htmlFor="llt-month">월</label>
        <select id="llt-month" value={month} onChange={e => setMonth(Number(e.target.value))}>
          {months.map(m => <option key={m} value={m}>{m}월</option>)}
        </select>
        <button onClick={handleSearch} disabled={loading}>
          {loading ? "조회 중..." : "개정 내역 검색"}
        </button>
      </div>

      {loading && (
        <div className="llt-status">
          <div className="step">{year}년 {month}월 고용노동부 소관 법령을 조회하고 있습니다</div>
          <span className="dot"></span><span className="dot"></span><span className="dot"></span>
        </div>
      )}

      {error && (
        <div className="llt-error">
          ⚠ {error}<br/>
          서버 연결 상태나 법령 API 키(LAW_OC) 설정을 확인해 주세요.
        </div>
      )}

      {!loading && !error && lawList && lawList.length === 0 && (
        <div className="llt-empty">{year}년 {month}월에는 고용노동부 소관 법령 개정 시행 내역이 없습니다.</div>
      )}

      {!loading && lawList && lawList.length > 0 && (
        <div className="llt-lawlist">
          {lawList.map((law, i) => (
            <LawItem
              key={i}
              law={law}
              expanded={expandedMst === law.법령일련번호}
              onToggle={() => handleToggle(law)}
              detail={detailCache[law.법령일련번호]}
              loading={detailLoading === law.법령일련번호}
              error={detailError[law.법령일련번호]}
            />
          ))}
        </div>
      )}

      {!loading && !searched && (
        <div className="llt-empty">연도와 월을 선택하고 검색 버튼을 눌러보세요.</div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('app-root')).render(<App />);
</script>
